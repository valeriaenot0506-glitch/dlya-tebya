<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди пару 💞</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .memory-card {
    text-align: center;
    position: relative;
    max-width: 700px;
  }

  .game-title {
    color: #ff6b9d;
    font-size: 2.1em;
    margin-bottom: 8px;
    text-shadow: 0 0 25px rgba(255, 107, 157, 0.6);
  }

  .game-hint {
    color: #b8b8c8;
    font-style: italic;
    margin-bottom: 15px;
    font-size: 0.95em;
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 10px 0 15px;
    font-size: 1.15em;
  }
  .score-board span { color: #ff6b9d; font-weight: bold; }

  /* Поле с карточками */
  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 0 auto;
    max-width: 460px;
  }

  .tile {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
  }

  .tile-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }

  .tile.flipped .tile-inner,
  .tile.matched .tile-inner {
    transform: rotateY(180deg);
  }

  .tile-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Рубашка (закрытая карточка) */
  .tile-back {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    box-shadow: 0 6px 18px rgba(255, 107, 157, 0.4);
    font-size: 1.6em;
    color: white;
  }

  /* Лицо (открытая карточка) */
  .tile-front {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 107, 157, 0.4);
    transform: rotateY(180deg);
  }

  .tile-front img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
  }

  .tile.matched .tile-front {
    border-color: #4ade80;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
  }

  .tile.matched {
    animation: matchPulse 0.6s ease-out;
  }
  @keyframes matchPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Финальный экран */
  .win-screen {
    display: none;
    animation: popIn 0.6s ease-out;
  }
  .win-screen.active { display: block; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .win-screen h2 {
    color: #ff6b9d;
    font-size: 2em;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255, 107, 157, 0.6);
  }

  .win-screen .btn { margin-top: 20px; }

  .btn-restart {
    background: rgba(255, 255, 255, 0.1);
    color: #e8e8e8;
    border: 2px solid rgba(255, 255, 255, 0.3);
    padding: 12px 30px;
    font-size: 1em;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 15px;
    transition: all 0.3s;
  }
  .btn-restart:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
  }

  .game-hidden { display: none; }

  @media (max-width: 420px) {
    #board { gap: 7px; }
    .tile-back { font-size: 1.2em; }
  }
</style>
</head>
<body>

  <div id="hearts-bg"></div>

  <main class="card memory-card">

    <div id="gameBlock">
      <h1 class="game-title">Найди пару 💞</h1>
      <p class="game-hint">Открывай карточки и находи одинаковые картинки</p>

      <div class="score-board">
        <div>Ходы: <span id="moves">0</span></div>
        <div>Пары: <span id="pairsFound">0</span> / <span id="pairsTotal">6</span></div>
      </div>

      <div id="board"></div>
    </div>

    <div class="win-screen" id="winScreen">
      <h2 id="winTitle">Победа! 🎉</h2>
      <p class="text" id="winText">Ты нашёл все пары!</p>
      <a href="page4.html" class="btn">Дальше →</a>
      <br>
      <button class="btn-restart" id="btnRestart">Играть ещё 🔄</button>
      <br>
      <a href="index.html" class="btn-restart" style="text-decoration:none; display:inline-block; margin-top:10px;">В начало ←</a>
    </div>

  </main>

  <script>
    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsFoundEl = document.getElementById('pairsFound');
    const pairsTotalEl = document.getElementById('pairsTotal');
    const winScreen = document.getElementById('winScreen');
    const winTitle = document.getElementById('winTitle');
    const winText = document.getElementById('winText');
    const btnRestart = document.getElementById('btnRestart');
    const gameBlock = document.getElementById('gameBlock');

    // ====== НАСТРОЙКА КАРТИНОК ДЛЯ ИГРЫ ======
    const IMAGE_START = 11;        // ← с какой цифры
    const IMAGE_END   = 16;        // ← до какой (включительно)
    const IMAGE_EXT   = 'jpg';
    const IMAGE_PATH  = 'image/';  // ← твоя папка
    // =========================================

    // Собираем список картинок
    const imageList = [];
    for (let i = IMAGE_START; i <= IMAGE_END; i++) {
      imageList.push(IMAGE_PATH + i + '.' + IMAGE_EXT);
    }
    console.log('Картинки для "Найди пару":', imageList);

    const PAIRS_COUNT = imageList.length;
    pairsTotalEl.textContent = PAIRS_COUNT;

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let pairsFound = 0;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      board.innerHTML = '';
      firstCard = secondCard = null;
      lockBoard = false;
      moves = 0;
      pairsFound = 0;
      movesEl.textContent = '0';
      pairsFoundEl.textContent = '0';
      winScreen.classList.remove('active');
      gameBlock.classList.remove('game-hidden');

      // Каждая картинка дважды → перемешиваем
      const deck = shuffle([...imageList, ...imageList]);

      deck.forEach(src => {
        const tile = document.createElement('div');
        tile.className = 'tile';

        const inner = document.createElement('div');
        inner.className = 'tile-inner';

        const back = document.createElement('div');
        back.className = 'tile-face tile-back';
        back.textContent = '?';

        const front = document.createElement('div');
        front.className = 'tile-face tile-front';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.onerror = () => console.warn('НЕ НАЙДЕНА КАРТИНКА:', img.src);
        front.appendChild(img);

        inner.appendChild(back);
        inner.appendChild(front);
        tile.appendChild(inner);

        tile.dataset.src = src;
        tile.addEventListener('click', () => flipTile(tile));

        board.appendChild(tile);
      });
    }

    function flipTile(tile) {
      if (lockBoard) return;
      if (tile === firstCard) return;
      if (tile.classList.contains('flipped') || tile.classList.contains('matched')) return;

      tile.classList.add('flipped');

      if (!firstCard) {
        firstCard = tile;
        return;
      }

      secondCard = tile;
      moves++;
      movesEl.textContent = moves;
      lockBoard = true;

      if (firstCard.dataset.src === secondCard.dataset.src) {
        setTimeout(() => {
          firstCard.classList.add('matched');
          secondCard.classList.add('matched');
          pairsFound++;
          pairsFoundEl.textContent = pairsFound;

          resetTurn();

          if (pairsFound === PAIRS_COUNT) {
            endGame();
          }
        }, 500);
      } else {
        setTimeout(() => {
          firstCard.classList.remove('flipped');
          secondCard.classList.remove('flipped');
          resetTurn();
        }, 900);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function endGame() {
      setTimeout(() => {
        gameBlock.classList.add('game-hidden');
        winScreen.classList.add('active');
        winTitle.textContent = 'Победа! 🎉';
        winText.textContent = 'Ты нашёл все пары за ' + moves + ' ходов! Ты супер 💖';
      }, 700);
    }

    btnRestart.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
